name: mfe-checkout

on:
  push:
    branches: [main]
    paths:
      - 'mfe-checkout/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mfe-checkout/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mfe-checkout

      - name: Build
        run: npm run build
        working-directory: mfe-checkout

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Deploy pre-built dist/ to Vercel. Vercel serves it as a static site.
      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }} \
            VERCEL_PROJECT_ID=${{ secrets.CHECKOUT_VERCEL_PROJECT_ID }} \
            vercel deploy mfe-checkout/dist --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Patch manifest
        run: |
          node scripts/patch-manifest.js checkout "${{ steps.deploy.outputs.deploy_url }}/remoteEntry.js" "${{ github.sha }}"

      - name: Commit manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shell/public/remoteEntry.json shell/public/manifest-history.json
          git diff --cached --quiet || git commit -m "chore: patch manifest — checkout @ ${{ github.sha }}"
          git push
