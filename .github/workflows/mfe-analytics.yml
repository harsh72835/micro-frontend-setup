name: mfe-analytics

on:
  push:
    branches: [main]
    paths:
      - 'mfe-analytics/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mfe-analytics/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mfe-analytics

      - name: Build
        run: npm run build
        working-directory: mfe-analytics

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        working-directory: mfe-analytics/dist
        run: |
          DEPLOY_URL=$(VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }} \
            VERCEL_PROJECT_ID=${{ secrets.ANALYTICS_VERCEL_PROJECT_ID }} \
            vercel deploy . --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          # Strip deployment hash (format: project-HASH-team.vercel.app → project-team.vercel.app)
          STABLE_URL=$(echo "$DEPLOY_URL" | sed -E 's|^(https://[^-]+-[^-]+-)[a-z0-9]{6,14}-|\1|')
          echo "prod_url=${STABLE_URL:-$DEPLOY_URL}" >> $GITHUB_OUTPUT

      - name: Patch manifest
        run: |
          node scripts/patch-manifest.js analytics "${{ steps.deploy.outputs.prod_url }}/remoteEntry.js" "${{ github.sha }}"

      - name: Commit manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shell/public/remoteEntry.json shell/public/manifest-history.json
          git diff --cached --quiet || git commit -m "chore: patch manifest — analytics @ ${{ github.sha }}"
          git pull --rebase origin main
          git push
