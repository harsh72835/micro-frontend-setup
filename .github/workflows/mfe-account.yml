name: mfe-account

on:
  push:
    branches: [main]
    paths:
      - 'mfe-account/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mfe-account/package-lock.json

      - name: Install
        run: npm ci
        working-directory: mfe-account

      - name: Build
        run: npm run build
        working-directory: mfe-account

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        working-directory: mfe-account/dist
        run: |
          DEPLOY_URL=$(VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }} \
            VERCEL_PROJECT_ID=${{ secrets.ACCOUNT_VERCEL_PROJECT_ID }} \
            vercel deploy . --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Patch manifest
        run: |
          node scripts/patch-manifest.js account "${{ steps.deploy.outputs.deploy_url }}/remoteEntry.js" "${{ github.sha }}"

      - name: Commit manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shell/public/remoteEntry.json shell/public/manifest-history.json
          git diff --cached --quiet || git commit -m "chore: patch manifest — account @ ${{ github.sha }}"
          git pull --rebase origin main
          git push
